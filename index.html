<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 Bó Hoa Ảnh - Dành Riêng Cho Em 🌸</title>
  <meta name="description" content="Một bó hoa ảnh lãng mạn chứa đựng triệu yêu thương dành riêng cho em.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bouquet.css">
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <div class="bouquet-screen" id="bouquetScreen">
    <div class="bouquet-wrap" id="bouquetWrap">
      <img src="img/bouquet.jpg" alt="Bó hoa dành tặng em" class="bouquet-img" id="bouquetImg">
      <div class="bouquet-glow"></div>
    </div>
    <p class="bouquet-hint" id="bouquetHint">Chạm vào bó hoa</p>
  </div>

  <div class="galaxy-screen" id="galaxyScreen">
    <div class="galaxy-actions">
      <button class="galaxy-btn" id="closeBouquetBtn" title="Đóng lại">&#10005;</button>
      <button class="galaxy-btn envelope-btn" id="openLetterBtn" title="Xem thư tình">&#9993;</button>
    </div>
    <div class="scene-container" id="sceneContainer">
      <div class="scene-world" id="sceneWorld"></div>
    </div>
    <div class="galaxy-hint">
      <span id="galaxyHintText">Kéo để xoay, cuộn hoặc chụm hai ngón để phóng to</span>
    </div>
  </div>

  <div class="letter-modal" id="letterModal">
    <div class="letter-modal-card">
      <button class="letter-modal-close" id="letterModalClose" title="Đóng">&#10005;</button>
      <div class="letter-modal-corner">&#127800;</div>
      <div class="letter-modal-header">
        <div class="letter-modal-salutation">Gửi Em Yêu &#9829;</div>
        <div class="letter-modal-stamp">&#128140; FROM WITH LOVE</div>
      </div>
      <div class="letter-modal-body" id="letterModalBody"></div>
      <span class="letter-modal-cursor" id="letterCursor">|</span>
      <div class="letter-modal-signature">
        <div class="letter-sign-line">Người yêu em nhất trên đời,</div>
        <div class="letter-sign-name">Xuân Trường &#9829;</div>
      </div>
    </div>
  </div>

  <div class="transition-overlay" id="transitionOverlay"></div>
  <script src="js/bouquet.js"></script>
</body>
</html>
