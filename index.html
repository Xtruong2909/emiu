<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💖 I LOVE YOU 💖</title>
  <meta name="description" content="Trái tim tình yêu với viền chữ I Love You lung linh và lãng mạn" />
  <meta name="theme-color" content="#18031d" />

  <!-- Google Fonts Preconnect & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Romantic Background Music -->
  <audio id="bgMusic" src="./sound/sound.mp3" loop preload="auto"></audio>

  <!-- Canvas for Heart, Borders, Particles, Stars, and Interactive Visuals -->
  <canvas id="loveCanvas"></canvas>

  <!-- Floating UI Overlay -->
  <div class="ui-layer">
    <!-- Top Romantic Badge -->
    <div class="top-pill" id="topPill">✨ Chạm vào trái tim hoặc màn hình để gửi trọn yêu thương ✨</div>

    <!-- Bottom Status / Hint -->
    <div class="bottom-prompt" id="bottomPrompt">🎵 Nhấp vào màn hình để bật nhạc lãng mạn</div>
  </div>

  <!-- Music Toggle Floating Button -->
  <button class="music-toggle" id="musicToggle" aria-label="Bật hoặc tắt nhạc nền" title="Bật/Tắt nhạc">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <div class="eq-bars">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
  </button>

  <!-- Interactive Center Heart Message -->
  <div class="center-heart-message" id="centerHeart" title="Nhấp vào để đập rộn ràng!">
    <h1 class="heart-calligraphy">I Love You</h1>
    <p class="heart-subtext">MÃI MÃI BÊN EM 💕</p>
  </div>

  <!-- Main Animation Script -->
  <script src="js/heart.js"></script>
</body>
</html>
